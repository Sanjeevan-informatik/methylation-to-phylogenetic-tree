[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "methylphylo"
version = "0.2.0"
description = "Reproducible exploratory phylogenies from DNA methylation beta-value matrices"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sanjeevan Vivekanantha" }]
keywords = ["bioinformatics", "dna-methylation", "phylogenetics", "upgma", "pca"]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
methylphylo = "methylphylo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
